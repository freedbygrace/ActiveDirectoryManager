apiVersion: apps/v1
kind: Deployment
metadata:
  name: ad-management
  namespace: ad-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ad-management
  template:
    metadata:
      labels:
        app: ad-management
    spec:
      containers:
      - name: activedirectorymanager
        image: ActiveDirectoryManager:2025.05.21.1430
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: ad-management-config
        - secretRef:
            name: ad-management-secrets
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: ad-management
  namespace: ad-management
spec:
  selector:
    app: ad-management
  ports:
  - port: 80
    targetPort: 5000
    name: http
  type: ClusterIP
